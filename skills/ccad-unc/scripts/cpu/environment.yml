# Entorno base para procesar tiles LiDAR y rásters en Helvetios y Serafín.
# Probado en los dos (2026-10). Cada cluster tiene su /home: el entorno se arma en cada uno.
# Agregar o quitar paquetes según el proyecto y volver a correr crear_entorno.sh.
name: geo
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy
  - scipy
  - pandas
  - pdal
  - python-pdal
  - gdal
  - rasterio
  - laspy
  - lazrs-python
  - geopandas
  - shapely
  - pyproj
  - scikit-learn
  - tqdm
